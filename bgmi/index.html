        /* Profile DP Fade Container */
        .profile-container {

            border: 4px solid #fff;
            overflow: hidden;

            background: #fff;
        }

        .profile-dp {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .profile-dp.active {

    <!-- 3 DP Fade Script (2 sec loop) -->

        const dps = document.querySelectorAll('.profile-dp');
